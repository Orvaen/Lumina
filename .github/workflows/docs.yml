name: Documentation

# Builds the documentation site and publishes it to GitHub Pages.
#
# The site is generated from include/Lumina/lumina.h and docs/*.dox, so a
# change to the library or its guides changes the site. Rather than guess
# which paths matter, this runs on every push to master; the build takes
# seconds.
#
# Before the first deployment can succeed, GitHub Pages has to be switched on
# once for the repository: Settings -> Pages -> Build and deployment ->
# Source: GitHub Actions. The workflow asks for it (see enablement below) but
# the Actions token is usually not allowed to create a Pages site, so the
# switch has to be flipped by hand. Until it is, this job fails at
# configure-pages with the build and the link check already green.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let a run in progress finish, because a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build the site
        run: npm run build

      # Every page and every fragment, including the base path the site is
      # served from. This has caught real breakage; it is a gate, not a report.
      - name: Check every internal link
        run: npm run check:links

      # Asks for Pages to be turned on. The Actions token normally lacks the
      # permission to create a site, so this is a convenience, not the
      # supported path: see the note at the top of this file.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    # Pull requests are built and link-checked, but only master is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
